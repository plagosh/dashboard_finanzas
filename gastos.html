<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos — Finanzas Personal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#121016; font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; padding:1.5rem; min-height:100vh; color:#f3e8ee; }
.wrap { max-width:960px; margin:0 auto; }

/* Header + navegación (igual en las 3 páginas) */
.header { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:1rem; background:rgba(28,22,34,0.65); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(244,114,182,0.15); border-radius:16px; padding:0.8rem 1.2rem; }
.header-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.titulo { font-size:1.1rem; font-weight:700; color:#fdf2f8; letter-spacing:-0.01em; }
.nav-links { display:flex; gap:6px; flex-wrap:wrap; }
.btn-nav { background:rgba(244,114,182,0.08); border:1px solid rgba(244,114,182,0.25); border-radius:8px; color:#fbcfe8; font-size:0.8rem; font-weight:600; padding:5px 12px; text-decoration:none; transition:all 0.2s; white-space:nowrap; }
.btn-nav:hover { background:rgba(244,114,182,0.22); border-color:#f472b6; color:#fff; }
.btn-nav.activo { background:rgba(244,114,182,0.28); border-color:#f472b6; color:#fff; pointer-events:none; }
.btn-logout { background:rgba(251,113,133,0.12); border:1px solid rgba(251,113,133,0.35); border-radius:8px; color:#fda4af; font-size:0.8rem; padding:5px 12px; cursor:pointer; font-weight:600; font-family:inherit; transition:all 0.2s; }
.btn-logout:hover { background:rgba(251,113,133,0.25); border-color:#fb7185; color:#fff; }

/* Barra de mes + acciones */
.toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:0.4rem; }
.toolbar-actions { display:flex; gap:8px; flex-wrap:wrap; }
.mes-nav { display:flex; align-items:center; gap:8px; }
.btn-mes { background:rgba(45,30,48,0.7); border:1px solid rgba(244,114,182,0.25); border-radius:8px; color:#fdf2f8; font-size:0.82rem; font-family:inherit; padding:4px 12px; cursor:pointer; transition:all 0.2s; }
.btn-mes:hover { background:rgba(244,114,182,0.2); border-color:rgba(244,114,182,0.45); }
.mes-actual { font-size:0.9rem; font-weight:600; color:#f472b6; min-width:120px; text-align:center; }
.sync-status { font-size:0.72rem; color:#9d8ba2; text-align:right; margin-bottom:1rem; }
.sync-status.ok { color:#f472b6; }
.sync-status.err { color:#fb7185; }

.card { background:rgba(28,22,34,0.75); border:1px solid rgba(244,114,182,0.15); border-radius:14px; padding:0.9rem 1.1rem; box-shadow:0 4px 15px rgba(0,0,0,0.2); }
.card-label { font-size:0.68rem; color:#fda4af; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; opacity:0.85; }
.seccion-titulo { font-size:0.75rem; font-weight:600; color:#f472b6; text-transform:uppercase; letter-spacing:0.08em; margin:1.2rem 0 0.6rem; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.hint { font-weight:400; text-transform:none; letter-spacing:0; font-size:0.68rem; color:#9d8ba2; }
select option { background:#1c1622; color:#f3e8ee; }
input[type="date"] { color-scheme:dark; }

@media (max-width:720px) { body { padding:1rem; } .header { padding:0.7rem 0.9rem; } }

.card-valor { font-size:1.05rem; font-weight:700; }
.card-valor.neg { color:#fb7185; }
.card-valor.neu { color:#e8d5e5; }
.form-nuevo { background:rgba(28,22,34,0.75); border:1px solid rgba(244,114,182,0.15); border-radius:14px; padding:1rem 1.1rem; margin-bottom:1rem; }
.form-titulo { font-size:0.75rem; font-weight:600; color:#f472b6; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.7rem; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.form-full { grid-column:1/-1; }
.inp { width:100%; background:rgba(45,30,48,0.7); border:1px solid rgba(244,114,182,0.2); border-radius:8px; padding:0.5rem 0.75rem; color:#fdf2f8; font-size:0.82rem; font-family:inherit; outline:none; transition:border-color 0.2s, box-shadow 0.2s; }
.inp::placeholder { color:#8a7690; }
.inp:focus { border-color:#f472b6; box-shadow:0 0 0 3px rgba(244,114,182,0.15); }
select.inp { appearance:none; cursor:pointer; }
.btn-agregar { width:100%; background:linear-gradient(135deg,#f472b6,#fb7185); border:none; color:#fff; font-weight:700; cursor:pointer; font-family:inherit; transition:filter 0.2s; border-radius:8px; font-size:0.85rem; padding:0.55rem; }
.btn-agregar:hover { filter:brightness(1.1); }
.btn-agregar:disabled { background:rgba(45,30,48,0.7); color:#8a7690; cursor:not-allowed; filter:none; }
.lista-gastos { display:flex; flex-direction:column; gap:6px; }
.gasto-item { background:rgba(28,22,34,0.75); border:1px solid rgba(244,114,182,0.1); border-radius:12px; padding:0.65rem 0.95rem; display:flex; align-items:center; gap:10px; transition:border-color 0.2s; }
.gasto-item:hover { border-color:rgba(244,114,182,0.3); }
.gasto-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.gasto-info { flex:1; min-width:0; }
.gasto-desc { font-size:0.84rem; color:#f3e8ee; }
.gasto-meta { font-size:0.68rem; color:#9d8ba2; margin-top:2px; }
.gasto-monto { font-size:0.88rem; font-weight:700; color:#fb7185; flex-shrink:0; }
.btn-del-gasto, .btn-edit-gasto { background:none; border:none; color:#6b5770; font-size:1rem; cursor:pointer; flex-shrink:0; transition:color 0.2s; padding:0 2px; }
.btn-edit-gasto { font-size:0.9rem; }
.btn-del-gasto:hover { color:#fb7185; }
.btn-edit-gasto:hover { color:#f472b6; }
.gasto-edit-form { background:rgba(45,30,48,0.6); border:1px solid rgba(244,114,182,0.35); border-radius:12px; padding:0.75rem 0.95rem; display:flex; flex-direction:column; gap:8px; }
.gasto-edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.gasto-edit-actions { display:flex; gap:8px; }
.btn-guardar-edit { flex:1; background:linear-gradient(135deg,#f472b6,#fb7185); border:none; color:#fff; font-weight:700; cursor:pointer; font-family:inherit; transition:filter 0.2s; border-radius:8px; font-size:0.8rem; padding:0.45rem; }
.btn-guardar-edit:hover { filter:brightness(1.1); }
.btn-guardar-edit:disabled { opacity:0.6; cursor:wait; }
.btn-cancelar-edit { flex:1; background:rgba(45,30,48,0.7); border:1px solid rgba(244,114,182,0.2); border-radius:8px; color:#e8d5e5; font-size:0.8rem; padding:0.45rem; cursor:pointer; font-family:inherit; }
.btn-cancelar-edit:hover { background:rgba(244,114,182,0.15); }
.empty-state { text-align:center; color:#8a7690; font-size:0.82rem; padding:2rem 0; }
.cat-summary { display:flex; flex-direction:column; gap:5px; margin-bottom:1rem; }
.cat-row { display:flex; align-items:center; gap:10px; background:rgba(28,22,34,0.75); border:1px solid rgba(244,114,182,0.1); border-radius:10px; padding:0.55rem 0.85rem; cursor:pointer; transition:background 0.15s, border-color 0.15s; }
.cat-row:hover { background:rgba(45,30,48,0.8); }
.cat-row.activa { border-color:#f472b6; box-shadow:inset 0 0 0 1px #f472b6; }
.cat-row-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.cat-row-name { font-size:0.8rem; color:#e8d5e5; flex:1; }
.cat-row-barra-track { flex:2; background:rgba(45,30,48,0.8); border-radius:4px; height:6px; overflow:hidden; }
.cat-row-barra-fill { height:100%; border-radius:4px; transition:width 0.4s; }
.cat-row-monto { font-size:0.78rem; color:#fdf2f8; font-weight:600; min-width:80px; text-align:right; }
.filtros { background:rgba(28,22,34,0.75); border:1px solid rgba(244,114,182,0.15); border-radius:14px; padding:0.75rem 0.9rem; margin-bottom:0.8rem; display:grid; grid-template-columns:2fr 1fr; gap:8px; }
.filtros-activos { font-size:0.72rem; color:#f472b6; margin:-0.3rem 0 0.6rem; display:none; }
.filtros-activos.show { display:block; }
.filtros-activos button { background:none; border:none; color:#fb7185; font-size:0.72rem; cursor:pointer; text-decoration:underline; margin-left:6px; font-family:inherit; }

/* Dos columnas: la de listados ocupa 1/3 */
.wrap { max-width:1280px; }
.cols { display:grid; gap:18px; align-items:start; }
.cols > div { min-width:0; }
.cols-gastos { grid-template-columns:2fr 1fr; }
.cols-finanzas { grid-template-columns:1fr 2fr; }
.cols > div > .seccion-titulo:first-child { margin-top:0; }
@media (max-width:900px) { .cols-gastos, .cols-finanzas { grid-template-columns:1fr; } }
.col-lista .filtros, .col-lista .gasto-edit-grid { grid-template-columns:1fr; }
.col-lista .gasto-item { display:grid; grid-template-columns:8px 1fr auto auto; column-gap:10px; row-gap:4px; align-items:center; }
.col-lista .gasto-dot { grid-row:1; grid-column:1; }
.col-lista .gasto-info { grid-row:1; grid-column:2 / 5; }
.col-lista .gasto-monto { grid-row:2; grid-column:2; }
.col-lista .btn-edit-gasto { grid-row:2; grid-column:3; }
.col-lista .btn-del-gasto { grid-row:2; grid-column:4; }
@media (max-width:560px) { .form-grid, .gasto-edit-grid, .filtros { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="titulo">💸 Gastos</div>
    <div class="header-actions">
      <nav class="nav-links">
        <a class="btn-nav" href="dashboard">📊 Dashboard</a>

      <input class="inp form-full" id="g-desc" placeholder="Descripción (ej: Sushi con amigos)"/>
      <input class="inp" id="g-monto" type="number" min="0" placeholder="$ Monto"/>
      <select class="inp" id="g-cat">
        <option value="">— Categoría —</option>
      </select>

        <option value="Débito">Débito</option>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyBOQcAM_qUgsr2SiDO4ZJtHSHJP25g0GSA",
  authDomain: "finanzas-personal-12490.firebaseapp.com",
  projectId: "finanzas-personal-12490",
  storageBucket: "finanzas-personal-12490.firebasestorage.app",
  messagingSenderId: "1062344169400",
  appId: "1:1062344169400:web:75075634e2d4a416b3614d"
};

const app      = initializeApp(firebaseConfig);
const db       = getFirestore(app);

// Acceso: misma sesión de Google que el dashboard. Si no hay sesión válida, vuelve al login.
const ALLOWED_EMAIL = 'plagosh1@gmail.com';
function protegerPagina(alEntrar) {
  let iniciado = false;
  onAuthStateChanged(getAuth(app), async user => {
    if (user && user.email === ALLOWED_EMAIL) {
      if (!iniciado) { iniciado = true; alEntrar(); }
    } else {
      if (user) { try { await signOut(getAuth(app)); } catch (e) {} }
      window.location.href = './';
    }
  });
}

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// Las categorías ahora viven en Firestore (colección "categorias", compartida con finanzas.html) y llegan en vivo.
// Cada gasto guarda su propio catLabel/catColor al crearse, así que un gasto viejo nunca cambia de aspecto
// aunque la categoría se edite o elimine después — solo cambia el selector para gastos nuevos.
let categoriasLive = [];

function suscribirCategorias() {
  const q = query(collection(db,'categorias'), orderBy('orden','asc'));
  onSnapshot(q, snap => {
    categoriasLive = snap.docs.map(d=>({id:d.id, ...d.data()}));
    poblarSelectCategorias();
    poblarFiltroCategorias();
  });
}

function poblarSelectCategorias() {
  const sel = document.getElementById('g-cat');
  const actual = sel.value;
  sel.innerHTML = '<option value="">— Categoría —</option>' + categoriasLive.map(c=>`<option value="${c.key}">${c.label}</option>`).join('');
  if ([...sel.options].some(o=>o.value===actual)) sel.value = actual;
}

function poblarFiltroCategorias() {
  const sel = document.getElementById('f-cat');
  const actual = sel.value;
  sel.innerHTML = '<option value="">Todas las categorías</option>' + categoriasLive.map(c=>`<option value="${c.key}">${c.label}</option>`).join('');
  if ([...sel.options].some(o=>o.value===actual)) sel.value = actual;
}

function catInfo(catKey) { return categoriasLive.find(c=>c.key===catKey); }

const hoy = new Date();
let mesIdx = hoy.getMonth();
let anio   = hoy.getFullYear();
let gastos = [];
let unsubscribe = null;
let editandoId = null;
let filtroTexto = '';
let filtroCat = '';

function mesKey() { return `${anio}-${String(mesIdx+1).padStart(2,'0')}`; }
function mesKeyDeFecha(fechaStr) { const [y,m]=fechaStr.split('-'); return `${y}-${m}`; }
function fmt(n)   { return '$'+Math.round(Math.abs(n)).toLocaleString('es-CL'); }
function setSyncStatus(msg, cls='') { const el=document.getElementById('sync-status'); el.textContent=msg; el.className='sync-status '+cls; }

function descargarCSV(filename, headers, rows) {
  const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const lineas = [headers.map(esc).join(';'), ...rows.map(r=>r.map(esc).join(';'))];
  const csv = '﻿' + lineas.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function gastosFiltrados() {
  return gastos.filter(g=>{
    if (filtroCat && g.catKey!==filtroCat) return false;
    if (filtroTexto) {
      const texto = `${g.desc} ${g.notas||''}`.toLowerCase();
      if (!texto.includes(filtroTexto)) return false;
    }
    return true;
  });
}

function actualizarFiltrosActivos() {
  const el = document.getElementById('filtros-activos');
  const partes = [];
  if (filtroCat) partes.push(`categoría: ${catInfo(filtroCat)?.label||filtroCat}`);
  if (filtroTexto) partes.push(`texto: "${filtroTexto}"`);
  if (!partes.length) { el.classList.remove('show'); el.innerHTML=''; return; }
  el.innerHTML = `Filtrando por ${partes.join(' · ')} <button id="btn-limpiar-filtros">Limpiar</button>`;
  el.classList.add('show');
  document.getElementById('btn-limpiar-filtros').addEventListener('click', ()=>{
    filtroCat=''; filtroTexto='';
    document.getElementById('f-cat').value='';
    document.getElementById('f-busca').value='';
    renderResumen(); renderLista();
  });
}

function renderResumen() {
  const total=gastos.reduce((a,g)=>a+g.monto,0);
  const count=gastos.length;
  const porCat={};
  gastos.forEach(g=>{ porCat[g.catKey]=(porCat[g.catKey]||0)+g.monto; });
  const maxVal=Math.max(...Object.values(porCat),1);
  const sumCont=document.getElementById('cat-summary');
  sumCont.innerHTML='';
  Object.entries(porCat).sort((a,b)=>b[1]-a[1]).forEach(([key,val])=>{
    const ejemplo=gastos.find(g=>g.catKey===key);
    const color=ejemplo.catColor||catInfo(key)?.color||'#aaa';
    const label=ejemplo.catLabel||catInfo(key)?.label||key;
    const row=document.createElement('div'); row.className='cat-row'+(filtroCat===key?' activa':'');
    row.innerHTML=`<div class="cat-row-dot" style="background:${color}"></div><div class="cat-row-name">${label}</div><div class="cat-row-barra-track"><div class="cat-row-barra-fill" style="width:${(val/maxVal*100).toFixed(0)}%;background:${color}"></div></div><div class="cat-row-monto">${fmt(val)}</div>`;
    row.addEventListener('click', ()=>{
      filtroCat = (filtroCat===key) ? '' : key;
      document.getElementById('f-cat').value = filtroCat;
      renderResumen();
      renderLista();
    });
    sumCont.appendChild(row);
  });
  if(!Object.keys(porCat).length) sumCont.innerHTML='<div class="empty-state">Sin gastos este mes</div>';
  actualizarFiltrosActivos();
}

function opcionesCategoria(selKey) {
  return categoriasLive.map(c=>`<option value="${c.key}" ${c.key===selKey?'selected':''}>${c.label}</option>`).join('');
}

function renderFormEdit(g) {
  const wrap=document.createElement('div'); wrap.className='gasto-edit-form';
  wrap.innerHTML=`
    <input class="inp" data-f="desc" value="${g.desc.replace(/"/g,'&quot;')}" placeholder="Descripción"/>
    <div class="gasto-edit-grid">
      <input class="inp" data-f="monto" type="number" min="0" value="${g.monto}"/>
      <select class="inp" data-f="catKey">${opcionesCategoria(g.catKey)}</select>
      <select class="inp" data-f="metodo">
        ${['Débito','Efectivo','Crédito','Transferencia','App'].map(m=>`<option ${m===g.metodo?'selected':''}>${m}</option>`).join('')}
      </select>
      <select class="inp" data-f="tipo">
        ${['Variable','Fijo'].map(t=>`<option ${t===g.tipo?'selected':''}>${t}</option>`).join('')}
      </select>
      <input class="inp" data-f="fecha" type="date" value="${g.fecha}"/>
      <input class="inp" data-f="notas" value="${(g.notas||'').replace(/"/g,'&quot;')}" placeholder="Notas"/>
    </div>
    <div class="gasto-edit-actions">
      <button class="btn-guardar-edit">Guardar</button>
      <button class="btn-cancelar-edit">Cancelar</button>
    </div>`;

  wrap.querySelector('.btn-cancelar-edit').addEventListener('click', ()=>{ editandoId=null; renderLista(); });

  wrap.querySelector('.btn-guardar-edit').addEventListener('click', async ()=>{
    const val=f=>wrap.querySelector(`[data-f="${f}"]`).value;
    const desc=val('desc').trim();
    const monto=parseFloat(val('monto'))||0;
    const catKey=val('catKey');
    const fecha=val('fecha');
    if(!desc||monto<=0||!catKey||!fecha){ alert('Completa descripción, monto, categoría y fecha'); return; }
    const catData=catInfo(catKey);
    const btn=wrap.querySelector('.btn-guardar-edit');
    btn.disabled=true; btn.textContent='Guardando…';
    try {
      await updateDoc(doc(db,'gastos',g.fireId),{
        desc, monto, catKey,
        catLabel: catData?.label||catKey,
        catColor: catData?.color||'#aaa',
        metodo: val('metodo'),
        tipo: val('tipo'),
        fecha,
        notas: val('notas').trim(),
        mesKey: mesKeyDeFecha(fecha) // si cambias el mes de la fecha, el gasto se mueve de vista automáticamente
      });
      editandoId=null;
      // si el nuevo mesKey ya no es el mes que estás viendo, el gasto desaparece de esta lista al re-suscribir
    } catch(e){ alert('Error al guardar: '+e.message); btn.disabled=false; btn.textContent='Guardar'; }
  });

  return wrap;
}

function renderLista() {
  const lista=document.getElementById('lista-gastos');
  lista.innerHTML='';
  if(!gastos.length){ lista.innerHTML='<div class="empty-state">Sin gastos registrados este mes</div>'; return; }
  const filtrados = gastosFiltrados();
  if(!filtrados.length){ lista.innerHTML='<div class="empty-state">Sin resultados para el filtro actual</div>'; return; }
  [...filtrados].sort((a,b)=>b.fecha.localeCompare(a.fecha)).forEach(g=>{
    if(g.fireId===editandoId){ lista.appendChild(renderFormEdit(g)); return; }
    const color=g.catColor||catInfo(g.catKey)?.color||'#aaa';
    const item=document.createElement('div'); item.className='gasto-item';
    item.innerHTML=`<div class="gasto-dot" style="background:${color}"></div><div class="gasto-info"><div class="gasto-desc">${g.desc}</div><div class="gasto-meta">${g.fecha} · ${g.metodo} · ${g.tipo}${g.notas?' · '+g.notas:''}</div></div><div class="gasto-monto">${fmt(g.monto)}</div><button class="btn-edit-gasto" data-id="${g.fireId}">✎</button><button class="btn-del-gasto" data-id="${g.fireId}">×</button>`;
    item.querySelector('.btn-edit-gasto').addEventListener('click', e=>{ e.stopPropagation(); editandoId=g.fireId; renderLista(); });
    item.querySelector('.btn-del-gasto').addEventListener('click', async e=>{ e.stopPropagation(); if(!confirm('¿Eliminar este gasto?')) return; await deleteDoc(doc(db,'gastos',g.fireId)); });
    lista.appendChild(item);
  });
}

function suscribir() {
  if(unsubscribe) unsubscribe();
  setSyncStatus('Cargando…');
  try {
    const q=query(collection(db,'gastos'), where('mesKey','==',mesKey()), orderBy('fecha','desc'));
    unsubscribe=onSnapshot(q, snap=>{ gastos=snap.docs.map(d=>({fireId:d.id,...d.data()})); setSyncStatus('✓ En vivo','ok'); renderResumen(); renderLista(); }, ()=>setSyncStatus('Error de conexión','err'));
  } catch(e) { setSyncStatus('Error: '+e.message,'err'); }
}



document.getElementById('mes-label').textContent = MESES[mesIdx]+' '+anio;
document.getElementById('g-fecha').value = new Date().toISOString().split('T')[0];
protegerPagina(() => {
  suscribirCategorias();
  suscribir();
});

document.getElementById('btn-prev').addEventListener('click', ()=>{ mesIdx--; if(mesIdx<0){mesIdx=11;anio--;} document.getElementById('mes-label').textContent=MESES[mesIdx]+' '+anio; suscribir(); });
document.getElementById('btn-next').addEventListener('click', ()=>{ mesIdx++; if(mesIdx>11){mesIdx=0;anio++;} document.getElementById('mes-label').textContent=MESES[mesIdx]+' '+anio; suscribir(); });

document.getElementById('f-busca').addEventListener('input', e=>{ filtroTexto = e.target.value.trim().toLowerCase(); actualizarFiltrosActivos(); renderLista(); });
document.getElementById('f-cat').addEventListener('change', e=>{ filtroCat = e.target.value; renderResumen(); renderLista(); });

document.getElementById('btn-csv').addEventListener('click', ()=>{
  const datos = gastosFiltrados();
  const headers=['Fecha','Descripción','Categoría','Monto','Método','Tipo','Notas'];
  const rows=[...datos].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(g=>[
    g.fecha, g.desc, g.catLabel||catInfo(g.catKey)?.label||g.catKey, g.monto, g.metodo, g.tipo, g.notas||''
  ]);
  const sufijo = filtroCat ? `_${filtroCat}` : '';
  descargarCSV(`gastos_${mesKey()}${sufijo}.csv`, headers, rows);
});

document.getElementById('btn-agregar').addEventListener('click', async ()=>{
  const desc=document.getElementById('g-desc').value.trim();
  const monto=parseFloat(document.getElementById('g-monto').value)||0;
  const catKey=document.getElementById('g-cat').value;
  const metodo=document.getElementById('g-metodo').value;
  const tipo=document.getElementById('g-tipo').value;
  const fecha=document.getElementById('g-fecha').value;
  const notas=document.getElementById('g-notas').value.trim();
  if(!desc||monto<=0||!catKey){ alert('Completa descripción, monto y categoría'); return; }
  const catData = catInfo(catKey);
  const btn=document.getElementById('btn-agregar');
  btn.disabled=true; btn.textContent='Guardando…';
  try {
    await addDoc(collection(db,'gastos'),{desc,monto,catKey,catLabel:catData?.label||catKey,catColor:catData?.color||'#aaa',metodo,tipo,fecha,notas,mesKey:mesKey(),creadoEn:new Date().toISOString()});
    document.getElementById('g-desc').value='';
    document.getElementById('g-monto').value='';
    document.getElementById('g-cat').value='';
    document.getElementById('g-notas').value='';
  } catch(e){ alert('Error al guardar: '+e.message); }
  btn.disabled=false; btn.textContent='Agregar gasto';
});

// Cerrar sesión (igual en las 3 páginas)
document.getElementById('btn-logout').addEventListener('click', async () => {
  try { await signOut(getAuth(app)); } catch (e) {} finally { window.location.href = './'; }
});
</script>
