<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rescatar deseos</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#121016; color:#f3e8ee; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .card { width:100%; max-width:480px; background:rgba(28,22,34,0.85); border:1px solid rgba(244,114,182,0.25); border-radius:18px; padding:1.5rem; }
  h1 { font-size:1.05rem; margin-bottom:0.4rem; color:#fdf2f8; }
  .sub { font-size:0.78rem; color:#b39db2; line-height:1.5; margin-bottom:1rem; }
  label { font-size:0.75rem; color:#b39db2; display:block; margin-bottom:4px; }
  input { width:100%; height:40px; background:rgba(45,30,48,0.8); border:1px solid rgba(244,114,182,0.3); border-radius:10px; color:#fff; padding:0 0.8rem; font-size:0.95rem; margin-bottom:12px; color-scheme:dark; }
  button { width:100%; height:42px; border:none; border-radius:12px; cursor:pointer; font-weight:700; font-size:0.88rem; color:#fff; background:linear-gradient(135deg,#f472b6,#db2777); margin-bottom:8px; }
  button:disabled { filter:grayscale(0.7) brightness(0.6); cursor:not-allowed; }
  pre { margin-top:0.6rem; background:rgba(0,0,0,0.35); border-radius:10px; padding:0.8rem; font-size:0.72rem; line-height:1.5; white-space:pre-wrap; color:#e9d5e5; max-height:45vh; overflow:auto; }
</style>
</head>
<body>
<div class="card">
  <h1>Rescatar la colección "deseos"</h1>
  <p class="sub">Lee la colección tal como estaba a la hora que indiques (solo funciona dentro de la última hora) y la vuelve a escribir en el proyecto Finanzas con los mismos IDs.</p>

  <button id="btn-login">1. Entrar al proyecto Finanzas</button>
  <label for="hora">2. Hora ANTES de borrarla (hora local, hoy)</label>
  <input id="hora" type="time" value="15:15"/>
  <button id="btn-leer" disabled>3. Buscar cómo estaba</button>
  <button id="btn-restaurar" disabled>4. Restaurar</button>
  <pre id="log">Primero entra con tu cuenta.</pre>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FINANZAS = {
  apiKey: "AIzaSyBOQcAM_qUgsr2SiDO4ZJtHSHJP25g0GSA",
  authDomain: "finanzas-personal-12490.firebaseapp.com",
  projectId: "finanzas-personal-12490",
  storageBucket: "finanzas-personal-12490.firebasestorage.app",
  messagingSenderId: "1062344169400",
  appId: "1:1062344169400:web:75075634e2d4a416b3614d"
};
const ALLOWED_EMAIL = 'plagosh1@gmail.com';
const COLECCION = 'deseos';

const app  = initializeApp(FINANZAS, 'rescate');
const auth = getAuth(app);
const db   = getFirestore(app);
const $ = id => document.getElementById(id);
const log = (m, limpiar = false) => { $('log').textContent = limpiar ? m : $('log').textContent + '\n' + m; };

let encontrados = [];

onAuthStateChanged(auth, u => {
  const ok = !!(u && u.email === ALLOWED_EMAIL);
  $('btn-leer').disabled = !ok;
  if (ok) log('✓ Sesión: ' + u.email + '\nAhora indica una hora anterior al borrado y pulsa Buscar.', true);
});
$('btn-login').addEventListener('click', async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { log('✗ Login: ' + e.code); }
});

// Convierte el formato REST de Firestore ({stringValue: ...}) a valores normales
function valor(v) {
  if ('stringValue' in v)    return v.stringValue;
  if ('booleanValue' in v)   return v.booleanValue;
  if ('integerValue' in v)   return Number(v.integerValue);
  if ('doubleValue' in v)    return v.doubleValue;
  if ('nullValue' in v)      return null;
  if ('timestampValue' in v) return new Date(v.timestampValue);
  if ('arrayValue' in v)     return (v.arrayValue.values || []).map(valor);
  if ('mapValue' in v)       return campos(v.mapValue.fields || {});
  return null;
}
function campos(f) { const o = {}; for (const k in f) o[k] = valor(f[k]); return o; }

$('btn-leer').addEventListener('click', async () => {
  const [hh, mm] = $('hora').value.split(':').map(Number);
  const t = new Date(); t.setHours(hh, mm, 0, 0);
  const minutos = Math.round((Date.now() - t) / 60000);
  if (minutos <= 0) { log('✗ Esa hora es futura.', true); return; }
  if (minutos > 59) { log(`✗ Esa hora fue hace ${minutos} min. Solo se puede leer la última hora; prueba una hora más reciente (pero anterior al borrado).`, true); return; }

  log(`Buscando "${COLECCION}" como estaba a las ${$('hora').value} (hace ${minutos} min)…`, true);
  $('btn-leer').disabled = true;
  try {
    const token = await auth.currentUser.getIdToken();
    encontrados = [];
    let pageToken = '';
    do {
      const url = `https://firestore.googleapis.com/v1/projects/${FINANZAS.projectId}/databases/(default)/documents/${COLECCION}` +
        `?pageSize=300&readTime=${encodeURIComponent(t.toISOString())}&key=${FINANZAS.apiKey}` +
        (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '');
      const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
      const j = await r.json();
      if (!r.ok) throw new Error((j.error && (j.error.status + ': ' + j.error.message)) || r.status);
      (j.documents || []).forEach(d => encontrados.push({ id: d.name.split('/').pop(), data: campos(d.fields || {}) }));
      pageToken = j.nextPageToken || '';
    } while (pageToken);

    if (!encontrados.length) {
      log('No había documentos a esa hora. Prueba una hora un poco anterior (siempre dentro de la última hora).');
    } else {
      log(`✓ Encontré ${encontrados.length} deseos:`);
      encontrados.forEach(d => log(`  • ${d.data.nombre || '(sin nombre)'}${d.data.precio ? ' — $' + d.data.precio : ''}${d.data.comprado ? ' ✓' : ''}`));
      log('\nSi la lista está bien, pulsa Restaurar.');
      $('btn-restaurar').disabled = false;
    }
  } catch (e) {
    console.error(e);
    log('✗ Error al leer: ' + e.message);
  }
  $('btn-leer').disabled = false;
});

$('btn-restaurar').addEventListener('click', async () => {
  $('btn-restaurar').disabled = true;
  try {
    for (let i = 0; i < encontrados.length; i += 400) {
      const lote = writeBatch(db);
      encontrados.slice(i, i + 400).forEach(d => lote.set(doc(db, COLECCION, d.id), d.data));
      await lote.commit();
    }
    log(`\n✓ Restaurados ${encontrados.length} documentos en "${COLECCION}". Revisa la consola de Firebase.`);
  } catch (e) {
    console.error(e);
    log('✗ Error al escribir: ' + (e.code || e.message) + (e.code === 'permission-denied' ? '\nLas reglas de Finanzas deben permitir escribir en "deseos".' : ''));
    $('btn-restaurar').disabled = false;
  }
});
</script>
</body>
</html>
